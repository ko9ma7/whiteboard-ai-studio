<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5ebd7"><title>페이지를 찾을 수 없습니다 · Whiteboard AI Motion Studio</title><link rel="icon" href="./assets/icons/favicon.svg"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eee9df;color:#292722;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.box{width:min(560px,calc(100vw - 36px));background:#fffdf8;border:1px solid #ded8cc;border-radius:18px;padding:28px;box-shadow:0 20px 55px rgba(40,35,27,.1)}.mark{width:52px;height:52px;display:grid;place-items:center;border-radius:14px;background:#1f5c4a;color:white;font-weight:800;font-size:24px}h1{font-size:24px;margin:18px 0 8px}p{color:#6d6a64;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}button,a{border:0;border-radius:9px;padding:10px 14px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;text-decoration:none}.home{background:#1f5c4a;color:white}.back{background:#e9e3d8;color:#2b2925}</style></head><body><main class="box"><div class="mark">W</div><h1>페이지를 찾을 수 없습니다</h1><p>주소가 잘못되었거나 이동된 페이지입니다. 편집 중인 프로젝트 데이터는 브라우저 자동저장에 남아 있을 수 있습니다.</p><div class="actions"><a id="home" class="home" href="./">서비스 홈</a><button class="back" onclick="history.back()">이전 페이지</button></div></main><script>const configured='__SITE_URL__';if(!configured.includes('__SITE_URL__'))document.getElementById('home').href=configured;else{const p=location.pathname.split('/').filter(Boolean);document.getElementById('home').href=location.hostname.endsWith('github.io')&&p.length?'/'+p[0]+'/':'/';}</script></body></html>
